name: Linux Release

# Builds the Linux release assets (AppImages + portable tarballs) for both
# x86_64 and arm64 on native runners and publishes them to the GitHub release
# for the pushed tag. Manual dispatches only build and upload artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (X.Y.Z, without the v prefix)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: airflash-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools file

      - name: Build AppImages (backend and full)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          DOTNET_RUNTIME: ${{ matrix.rid }}
        run: |
          packaging/linux/appimage/build-appimage.sh
          VARIANT=full packaging/linux/appimage/build-appimage.sh

      - name: Portable tarball of the full AppDir
        # The extracted tree keeps real files, so users can grant the engine
        # CAP_NET_BIND_SERVICE for true PTP timing (impossible inside an
        # AppImage mount, where the engine falls back to NTP automatically).
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar -czf "dist/AppImage/AirFlash-$VERSION-$ARCH.tar.gz" \
            -C build/appimage AirFlash.AppDir
          ls -la dist/AppImage/

      - uses: actions/upload-artifact@v4
        with:
          name: airflash-linux-${{ matrix.arch }}
          path: |
            dist/AppImage/AirFlash-*.AppImage
            dist/AppImage/AirFlash-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  cli:
    name: CLI package (${{ matrix.arch }})
    # Built on Ubuntu 22.04 (glibc 2.35) so the headless binaries also run
    # on Raspberry Pi OS Bookworm and other older userlands; the AppImage
    # builds above stay on 24.04. The engine is pure Rust, so aarch64 is
    # cross-compiled on the x86_64 runner with the GNU cross linker.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            linker: ''
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            linker: 'aarch64-linux-gnu-gcc'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build headless binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          cargo build --release --locked --features cli \
            --target ${{ matrix.target }} \
            --manifest-path native/airflash-engine/Cargo.toml

      - name: Stage the CLI tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          stage="AirFlash-$VERSION-$ARCH-cli"
          mkdir -p "$stage"
          bindir="native/airflash-engine/target/$TARGET/release"
          cp "$bindir/airflash-engine" "$bindir/airflash-cli" "$stage/"
          cp packaging/linux/systemd/user/airflash-cli.service \
             packaging/linux/systemd/user/airflash-cli@.service "$stage/"
          cp packaging/linux/config/cli.json.example \
             packaging/linux/config/cli.env.example "$stage/"
          cp docs/HEADLESS.md "$stage/README.md"
          tar -czf "$stage.tar.gz" "$stage"
          ls -la "$stage.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: airflash-cli-${{ matrix.arch }}
          path: AirFlash-*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [build, cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Combined checksums
        run: |
          cd assets
          sha256sum AirFlash-*.AppImage AirFlash-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: AirFlash ${{ github.ref_name }} · Linux
          body_path: docs/LINUX-RELEASE-NOTES.md
          files: |
            assets/AirFlash-*.AppImage
            assets/AirFlash-*.tar.gz
            assets/SHA256SUMS.txt
